[settings]
dotfiles.root = "."

# home/ の下を、同じパスでホームに置く
[dotfile_groups.home]
root = "home"
target = "~"
mode = "symlink-each"
manifest = "git"
exclude = [
  "**/*.tera",                     # テンプレート（下の [dotfiles] で描画して置く）
  ".claude/settings.json",         # 端末のファイルにキーだけ書き込む（下の [dotfiles]）
  ".gemini/antigravity-cli/settings.json",
  ".config/nvim/lazy-lock.json",   # 以下は chezmoi でも置いていなかったもの
  ".codex/config.toml",
  ".codex/log/**",
  ".codex/version.json",
  "**/.keep",
]

# 本人だけが読み書きできる権限で置くもの（symlink には権限を付けられないので copy）
[dotfile_groups.home.entries]
"~/.claude/scripts/README.md" = { mode = "copy", permissions = "0600" }
"~/.claude/scripts/SCHEDULING_GUIDE.md" = { mode = "copy", permissions = "0600" }
"~/.claude/skills/aws-lambda-typescript/examples/api-gateway-generic.ts" = { mode = "copy", permissions = "0600" }
"~/.claude/skills/aws-lambda-typescript/examples/error-handling-strategy.ts" = { mode = "copy", permissions = "0600" }
"~/.claude/skills/aws-lambda-typescript/examples/layered-architecture.ts" = { mode = "copy", permissions = "0600" }
# 端末ごとに社内レジストリの行を足すので、無いときだけ置く
"~/.npmrc" = { mode = "copy", create_if_missing = true, permissions = "0600" }

[dotfiles]
"~/.claude" = { permissions = "0700", depends = ["home"] }
"~/.config" = { permissions = "0700", depends = ["home"] }

# OS で中身を分けるもの
"~/.config/zsh/.zshrc" = { source = "home/.config/zsh/.zshrc.tera", mode = "template" }
"~/.config/zsh/alias.zsh" = { source = "home/.config/zsh/alias.zsh.tera", mode = "template" }
"~/.config/zsh/function.zsh" = { source = "home/.config/zsh/function.zsh.tera", mode = "template" }
"~/.config/mise/config.toml" = { source = "home/.config/mise/config.toml.tera", mode = "template" }
"~/.config/lazygit/config.yml" = { source = "home/.config/lazygit/config.yml.tera", mode = "template" }
"~/.zshrc" = { source = "~/.config/zsh/.zshrc", mode = "symlink", depends = ["~/.config/zsh/.zshrc"] }

# リポジトリにあるキーだけを書き込む。端末だけの値（業務の設定など）はそのまま残る
"~/.claude/settings.json/shared" = { source = "home/.claude/settings.json", merge = true, permissions = "0600" }
"~/.gemini/antigravity-cli/settings.json/shared" = { source = "home/.gemini/antigravity-cli/settings.json", merge = true, permissions = "0600" }
# merge の permissions は新しく作るときだけ効くので、既にあるファイルもここで 600 にする
"~/.claude/settings.json" = { permissions = "0600" }
"~/.gemini/antigravity-cli/settings.json" = { permissions = "0600" }
