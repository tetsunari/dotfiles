[settings]
dotfiles.root = "."

# home/ の下を、同じパスでホームに写す。Claude Code は mod のファイルが symlink だと
# 読まないため、symlink ではなく copy で置く。ホーム側で直したファイルは
# `mise dot add --changed` で home/ に戻す（戻す前に apply すると直した分が消える）
[dotfile_groups.home]
root = "home"
target = "~"
mode = "copy"
manifest = "git"
exclude = [
  "**/*.tera",                     # テンプレート（下の [dotfiles] で描画して置く）
  ".claude/settings.json",         # 端末のファイルにキーだけ書き込む（下の [dotfiles]）
  ".gemini/antigravity-cli/settings.json",
  ".config/nvim/lazy-lock.json",   # 以下は chezmoi でも置いていなかったもの
  ".codex/config.toml",
  ".codex/log/**",
  ".codex/version.json",
  "**/.keep",
]

# 本人だけが読み書きできる権限で置くもの（symlink には権限を付けられないので copy）
[dotfile_groups.home.entries]
"~/.claude/scripts/README.md" = { mode = "copy", permissions = "0600" }
"~/.claude/scripts/SCHEDULING_GUIDE.md" = { mode = "copy", permissions = "0600" }
"~/.claude/skills/aws-lambda-typescript/examples/api-gateway-generic.ts" = { mode = "copy", permissions = "0600" }
"~/.claude/skills/aws-lambda-typescript/examples/error-handling-strategy.ts" = { mode = "copy", permissions = "0600" }
"~/.claude/skills/aws-lambda-typescript/examples/layered-architecture.ts" = { mode = "copy", permissions = "0600" }
# 端末ごとに社内レジストリの行を足すので、無いときだけ置く
"~/.npmrc" = { mode = "copy", create_if_missing = true, permissions = "0600" }

# Linux（WSL）だけで使うもの。macOS では置かない
"~/Brewfile_wsl" = { variants = [{ os = "linux" }] }
"~/.bashrc" = { variants = [{ os = "linux" }] }
"~/.wslconfig" = { variants = [{ os = "linux" }] }
"~/.config/sway" = { variants = [{ os = "linux" }] }
"~/.config/systemd" = { variants = [{ os = "linux" }] }
"~/.config/wayvnc" = { variants = [{ os = "linux" }] }
"~/.config/NvChad" = { variants = [{ os = "linux" }] }
"~/setup-ahk" = { variants = [{ os = "linux" }] }

[dotfiles]
"~/.claude" = { permissions = "0700", depends = ["home"] }
"~/.config" = { permissions = "0700", depends = ["home"] }

# OS で中身を分けるもの
"~/.config/zsh/.zshrc" = { source = "home/.config/zsh/.zshrc.tera", mode = "template" }
"~/.config/zsh/alias.zsh" = { source = "home/.config/zsh/alias.zsh.tera", mode = "template" }
"~/.config/zsh/function.zsh" = { source = "home/.config/zsh/function.zsh.tera", mode = "template" }
"~/.config/mise/config.toml" = { source = "home/.config/mise/config.toml.tera", mode = "template" }
"~/.config/lazygit/config.yml" = { source = "home/.config/lazygit/config.yml.tera", mode = "template" }
"~/.zshrc" = { source = "~/.config/zsh/.zshrc", mode = "symlink", depends = ["~/.config/zsh/.zshrc"] }

# リポジトリにあるキーだけを書き込む。端末だけの値（業務の設定など）はそのまま残る
"~/.claude/settings.json/shared" = { source = "home/.claude/settings.json", merge = true, permissions = "0600" }
"~/.gemini/antigravity-cli/settings.json/shared" = { source = "home/.gemini/antigravity-cli/settings.json", merge = true, permissions = "0600" }
# Codex が書き足す作業フォルダの一覧などは端末に残し、揃えたいキーだけ書き込む
"~/.codex/config.toml/shared" = { source = "home/.codex/config.toml", merge = true }
# merge の permissions は新しく作るときだけ効くので、既にあるファイルもここで 600 にする
"~/.claude/settings.json" = { permissions = "0600" }
"~/.gemini/antigravity-cli/settings.json" = { permissions = "0600" }

# 新しい PC の初期設定（mise bootstrap）。hook と [tasks.bootstrap] は毎回走るので、
# 済んでいれば何もしない書き方にする
[bootstrap.packages]
"apt:build-essential" = { os = "linux" }
"apt:procps" = { os = "linux" }
"apt:curl" = { os = "linux" }
"apt:file" = { os = "linux" }
"apt:git" = { os = "linux" }
"apt:fcitx5" = { os = "linux" }
"apt:fcitx5-mozc" = { os = "linux" }
"apt:fcitx5-frontend-gtk3" = { os = "linux" }
"apt:fcitx5-frontend-gtk4" = { os = "linux" }
"apt:fcitx5-config-qt" = { os = "linux" }
"apt:language-pack-ja" = { os = "linux" }
"apt:fonts-ipafont" = { os = "linux" }
"apt:fonts-ipaexfont" = { os = "linux" }
"apt:bind9-dnsutils" = { os = "linux" }
"apt:libpulse0" = { os = "linux" }
"apt:telnet" = { os = "linux" }
"apt:zsh" = { os = "linux" }
"apt:sway" = { os = "linux" }
"apt:docker-ce" = { os = "linux" }
"apt:docker-ce-cli" = { os = "linux" }
"apt:containerd.io" = { os = "linux" }
"apt:docker-buildx-plugin" = { os = "linux" }
"apt:docker-compose-plugin" = { os = "linux" }
"brew-cask:docker-desktop" = { os = "macos" }
"brew-cask:antigravity-cli" = { os = "macos" }
# commit 前の .githooks/pre-commit で使う（WSL は Brewfile_wsl で入れる）
"brew:gitleaks" = { os = "macos" }

[bootstrap.apt.sources.docker]
uris = "https://download.docker.com/linux/ubuntu"
components = "stable"
key = "https://download.docker.com/linux/ubuntu/gpg"
fingerprint = "9DC8 5822 9FC7 DD38 854A E2D8 8D81 803C 0EBF CD88"

[bootstrap.user]
login_shell = "zsh"

# WSL のとき、WezTerm と .wslconfig を Windows 側のホームに写す
[bootstrap.hooks.post-dotfiles]
run = '''
set -eu
[ -n "${WSL_DISTRO_NAME:-}" ] || exit 0
win_home="${WINDOWS_HOME_DIR:-$(wslpath "$(/mnt/c/WINDOWS/system32/cmd.exe /c 'SET /P x=%USERPROFILE%<NUL' 2>/dev/null)")}"
cp -L "$HOME/.config/wezterm/wezterm.lua" "$win_home/.wezterm.lua"
mkdir -p "$win_home/.config/wezterm"
cp -RL "$HOME/.config/wezterm/." "$win_home/.config/wezterm/"
cp -L "$HOME/.wslconfig" "$win_home/.wslconfig"
'''

[tasks.bootstrap]
description = "mise bootstrap の最後に走る Linux の初期設定"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# commit の前に gitleaks で鍵・ユーザー名入りのパスを止める（.githooks/pre-commit）。macOS でも要るので Linux の判定より前に置く
git -C "$MISE_CONFIG_ROOT" config core.hooksPath .githooks
[ "$(uname -s)" = Linux ] || exit 0

brew=/home/linuxbrew/.linuxbrew/bin/brew
if [ ! -x "$brew" ]; then
  NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
fi
# task は zsh の設定を読まないので、ここで brew の PATH を通す
eval "$("$brew" shellenv)"
# postgresql@18 は入れた直後に en_US.UTF-8 で initdb する。無いと brew bundle ごと失敗する
# -q だと grep が先に抜け、pipefail の下で locale -a の SIGPIPE が失敗扱いになる
if ! locale -a | grep -ix 'en_US.utf8' >/dev/null; then
  sudo locale-gen en_US.UTF-8
fi
# --no-upgrade が無いと、入っているものまで新しい版に上げる
brew bundle install --no-upgrade --file "$HOME/Brewfile_wsl"
fc-cache -f

# sudo なしで docker を使う
user="$(id -un)"
if ! id -nG "$user" | grep -qw docker; then
  sudo usermod -aG docker "$user"
  echo "docker グループに入れた。反映には再ログインが要る"
fi

if [ -n "${WSL_DISTRO_NAME:-}" ] && ! grep -q "systemd=true" /etc/wsl.conf 2>/dev/null; then
  printf '[boot]\nsystemd=true\n' | sudo tee -a /etc/wsl.conf >/dev/null
  echo "WSL の systemd を有効にした。反映には Windows 側で wsl --shutdown が要る"
fi
'''
